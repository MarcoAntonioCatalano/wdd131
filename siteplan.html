<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="week05/styles/siteplan.css">
    <script src="week05/scripts/siteplan.js" defer></script>
    <title>Site Plan</title>
    <meta name="description" content="Las Experiencias de Trekking en Córdoba ofrecen una manera única de descubrir la riqueza natural, cultural y paisajística de una de las provincias más diversas de Argentina. Este servicio está diseñado para quienes buscan conectar con la naturaleza a través de caminatas guiadas por senderos emblemáticos, sierras históricas y rincones poco explorados que revelan la esencia del territorio cordobés.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
    <meta name="author" content="Marco Catalano">
</head>
<body>
    <div class="hero">
        
    </div>
    <header class="web-header">
    <a href="#" class="logo-container" id="Inicio"> 
        <img id="logo"  src="week05/images/logo.jpg" alt="Logo">
    </a>
    <button 
        id="menu"
        aria-label="Menu"
        aria-controls="primary-navigation"
        aria-expanded="false">
    </button>

    <nav class="navbar" aria-label="Main navigation">
        <ul class="nav-list" id="primary-navigation">
            <li><a href="#" id="quienes-somos">Quienes Somos</a></li>
            <li><a href="#" id="destinos">Destinos</a></li>
            <li><a href="#" id="comunidad">Comunidad</a></li>
            <li><a href="#" id="contacto">Contacto</a></li>
        </ul>
    </nav>
</header>
 <main class="main">
        <h1 class="page-title"></h1>  
         <form method="get" action="thanks.html" class="wf1">
            <fieldset>
                <legend>Info Viajero</legend>
                <label>Nombre Completo* <input type="text" name="fname" required></label>
                <label for="">Tel<input type="tel" name="phone" placeholder="1235551234"></label>
                <label for="">Correo @*<input type="email" name="email" placeholder="someone@gmail.com" required>
                
            </fieldset>
              <fieldset>
                <legend>Reservar Mi Asiento</legend>
                <label>Cuando quiero viajar<input type="date" name="completed date"></label>
                <label>Destino
                    <select name="subject">
                        <option value="">Quiero ir a...</option>
                        <option value="cumbresita">La Cumbresita
                            </option>
                        <option value="salinas-cordobesas">Salinas Cordobesas
                            </option>
                        <option value="los-gigantes">Los Gigantes
                            </option>
                        <option value="cerro-unitorco">Cerro Unitorco
                            </option>
                    </select>
                </label>

                <label># de viajeros<input type="number" name="travelers"></label>
              </fieldset>

              <input type="submit" value="Registrado">
         </form>
    </main>
    <footer class="site-footer">
        <div class="footer-info">
    <p>&copy; <span id="time"></span> | Marco Catalano | Utah</p>
    <p id="lastModified"></p>
    </div>
    <nav class="socialmedia">
        <a href="https://www.instagram.com/luzverdetrekking/?hl=en" id="insta">
            <img src="week05/images/insta.svg" alt="instagram-icon">
        </a>
        <a href="https://www.facebook.com/luzverdetrekking" id="facebook">
            <img src="week05/images/facebook.svg" alt="facebook-icon">
        </a>
    </nav>
</footer>
</body>
</html>
